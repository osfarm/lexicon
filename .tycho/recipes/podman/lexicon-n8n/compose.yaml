services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`${N8N_SUBDOMAIN:-n8n}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls.certresolver=${TRAEFIK_RESOLVER:-myresolver}
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    environment:
      - N8N_HOST=${N8N_SUBDOMAIN:-n8n}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_SUBDOMAIN:-n8n}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${N8N_GENERIC_TIMEZONE:-Europe/Paris}
    volumes:
      - ${N8N_DATA_LOCATION:-/data/lexicon/n8n}:/home/node/.n8n:z
