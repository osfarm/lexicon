---
name: ekyagri
without:
  - enterprises
  - pesticide_frequency_indicator
datasources:
  cadastre:
    registered_cadastral_parcels:
      filter: WHERE postgis.ST_DWithin(centroid , postgis.ST_GeomFromText('POINT(-0.534765 44.820503)',4326) , 2 )
  cadastre_owners:
    registered_cadastral_owners:
      filter: WHERE (majic_number, department_code) IN (SELECT majic_number, department_code FROM registered_cadastral_parcel_owners WHERE cadastral_parcel_id IN (SELECT id FROM registered_cadastral_parcels WHERE postgis.ST_DWithin(centroid , postgis.ST_GeomFromText('POINT(-0.534765 44.820503)',4326) , 2 )) UNION SELECT majic_number, department_code FROM registered_cadastral_premises WHERE cadastral_parcel_id IN (SELECT id FROM registered_cadastral_parcels WHERE postgis.ST_DWithin(centroid , postgis.ST_GeomFromText('POINT(-0.534765 44.820503)',4326) , 2 )))
    registered_cadastral_premises:
      filter: WHERE cadastral_parcel_id IN (SELECT id FROM registered_cadastral_parcels WHERE postgis.ST_DWithin(centroid , postgis.ST_GeomFromText('POINT(-0.534765 44.820503)',4326) , 2 ))
    registered_cadastral_parcel_owners:
      filter: WHERE cadastral_parcel_id IN (SELECT id FROM registered_cadastral_parcels WHERE postgis.ST_DWithin(centroid , postgis.ST_GeomFromText('POINT(-0.534765 44.820503)',4326) , 2 ))
  cadastral_prices:
    registered_cadastral_prices:
      filter: WHERE department IN ('17', '33')
  hydrography:
    registered_hydrographic_items:
      filter: WHERE id LIKE '%_fra_D017' OR id LIKE '%_fra_D033'
    registered_area_items:
      filter: WHERE id LIKE '%2005598064_fra_D017' OR id LIKE '%32376357_fra_D017' OR id LIKE '%2229718524_fra_D017'
    registered_cadastral_buildings:
      filter: WHERE postgis.ST_DWithin(centroid , postgis.ST_GeomFromText('POINT(-0.534765 44.820503)',4326) , 2 )
