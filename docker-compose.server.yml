# Lexicon v2, serving side. Deployed by Dokploy as a compose stack on the osfarm_lexicon server.
# Design: claudedocs/design_lexicon_v2_j1.md
#
# Variables, set in Dokploy:
#   POSTGRES_PASSWORD      password of the lexicon role
#   LEXICON_PACKAGES_DIR   directory of the host receiving the packages of `./lexicon publish`
#
# Optional, for the nightly copy of the packages to an S3 bucket (the `backup` service idles without them):
#   LEXICON_BACKUP_ENDPOINT     https://host:port of the S3 service
#   LEXICON_BACKUP_BUCKET       bucket receiving the copy
#   LEXICON_BACKUP_ACCESS_KEY   access key
#   LEXICON_BACKUP_SECRET_KEY   secret key
#   LEXICON_BACKUP_INTERVAL     seconds between two copies (default: 86400)
#
# Domains are attached in Dokploy to `api` (port 8888) and `packages` (port 80).

services:
  db:
    build:
      context: docker/db
    restart: unless-stopped
    shm_size: 2gb
    # The data is rebuilt from the packages: no replication, so loads skip the WAL (wal_level=minimal).
    # Memory is sized for a server shared with other stacks.
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=6GB
      -c effective_cache_size=14GB
      -c work_mem=64MB
      -c maintenance_work_mem=2GB
      -c wal_level=minimal
      -c max_wal_senders=0
      -c max_wal_size=16GB
      -c checkpoint_timeout=30min
    environment:
      POSTGRES_DB: lexicon
      POSTGRES_USER: lexicon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - lexicon_server_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexicon -d lexicon"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - lexicon

  loader:
    build:
      context: .
    restart: unless-stopped
    command: ["./lexicon-cli", "server", "watch", "--interval", "300"]
    environment:
      LEXICON_SERVER_DATABASE_URL: postgres://lexicon:${POSTGRES_PASSWORD:?}@db:5432/lexicon
      LEXICON_PACKAGES_ROOT: /packages
    volumes:
      - ${LEXICON_PACKAGES_DIR:?}:/packages
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lexicon

  # Public file server of the repository. It does not run as the owner of the files: packages reserved to
  # key holders and bundles are published readable by their owner only, so it cannot serve them.
  packages:
    image: caddy:2-alpine
    restart: unless-stopped
    user: "65534:65534"
    sysctls:
      # Lets an unprivileged user listen on port 80
      net.ipv4.ip_unprivileged_port_start: "0"
    environment:
      XDG_DATA_HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    command: ["caddy", "file-server", "--root", "/packages", "--browse", "--listen", ":80"]
    volumes:
      - ${LEXICON_PACKAGES_DIR:?}:/packages:ro
    networks:
      - dokploy-network

  # Mirrors the packages repository to an S3 bucket. The database is not saved: it is rebuilt from the packages.
  backup:
    image: rclone/rclone:1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$LEXICON_BACKUP_BUCKET" ]; then
          echo "backup: LEXICON_BACKUP_BUCKET is not set, nothing to do"
          exec sleep infinity
        fi
        while true; do
          # Never mirror an empty or unmounted repository: it would empty the copy
          if [ -f /packages/index.json ]; then
            # The dumps of the access schema are copied apart: the mirror of the packages must not delete them
            if rclone sync /packages "nas:$$LEXICON_BACKUP_BUCKET" --exclude ".*" --exclude "/_access/**" --transfers 4 --stats 0 \
              && rclone copy /dumps "nas:$$LEXICON_BACKUP_BUCKET/_access" --stats 0; then
              echo "backup: $$(date -u +%FT%TZ) copied to $$LEXICON_BACKUP_BUCKET"
            else
              echo "backup: $$(date -u +%FT%TZ) FAILED"
            fi
          else
            echo "backup: $$(date -u +%FT%TZ) no index.json in the repository, skipped"
          fi
          sleep "$$LEXICON_BACKUP_INTERVAL"
        done
    environment:
      RCLONE_CONFIG_NAS_TYPE: s3
      # "Other" addresses the bucket by path; "AWS" would look for a bucket sub-domain
      RCLONE_CONFIG_NAS_PROVIDER: Other
      RCLONE_CONFIG_NAS_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_NAS_ENDPOINT: ${LEXICON_BACKUP_ENDPOINT:-}
      RCLONE_CONFIG_NAS_ACCESS_KEY_ID: ${LEXICON_BACKUP_ACCESS_KEY:-}
      RCLONE_CONFIG_NAS_SECRET_ACCESS_KEY: ${LEXICON_BACKUP_SECRET_KEY:-}
      LEXICON_BACKUP_BUCKET: ${LEXICON_BACKUP_BUCKET:-}
      LEXICON_BACKUP_INTERVAL: ${LEXICON_BACKUP_INTERVAL:-86400}
    volumes:
      - ${LEXICON_PACKAGES_DIR:?}:/packages:ro
      - lexicon_access_dumps:/dumps:ro
    networks:
      - lexicon

  # API keys, plans and usage are the only state that cannot be rebuilt from the packages: they are dumped
  # every day, and the backup service copies the dumps to the bucket.
  access-dump:
    build:
      context: docker/db
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          file="/dumps/lexicon_access-$$(date -u +%F).sql.gz"
          if pg_dump -h db -U lexicon -d lexicon --schema=lexicon_access 2>/tmp/error | gzip > "$$file.tmp" && [ ! -s /tmp/error ]; then
            mv "$$file.tmp" "$$file"
            echo "access-dump: $$(date -u +%FT%TZ) wrote $$file"
          else
            rm -f "$$file.tmp"
            echo "access-dump: $$(date -u +%FT%TZ) nothing dumped: $$(head -1 /tmp/error)"
          fi
          find /dumps -name 'lexicon_access-*.sql.gz' -mtime +30 -delete
          sleep 86400
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - lexicon_access_dumps:/dumps
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lexicon

  api:
    image: ghcr.io/osfarm/lexicon-rest-api:latest
    # The tag moves with each release of the API: without this, a redeployment keeps the image already pulled
    pull_policy: always
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8888
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: lexicon
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: lexicon
      DB_SCHEMA: lexicon
      # Private bundles, handed out to the keys carrying their scope
      BUNDLES_ROOT: /bundles
    volumes:
      - ${LEXICON_PACKAGES_DIR:?}/_bundles:/bundles:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lexicon
      - dokploy-network

networks:
  lexicon:
  dokploy-network:
    external: true

volumes:
  lexicon_server_db:
  lexicon_access_dumps:
